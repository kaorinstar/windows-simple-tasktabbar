# Distribution: build, test, package, and attach the packages to a release.
#
# Three files are published, all carrying the same build: the installer, the portable ZIP, and
# the executable on its own.
#
# A tag push publishes the release. The tag decides both the version stamped into the binaries
# and the notes, which are taken from the matching section of version.md. A manual run is a dry
# run: it produces the same three packages as a workflow artifact, stamped with the version in
# Directory.Build.props, and creates no release, so a change here can be tried out before a tag
# exists.
#
# The build and test steps repeat those in .github/workflows/build.yml, except that this one
# passes the version from the tag. Change them in both files.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      # Everything the tag decides is worked out here, before anything is built: the version the
      # binaries carry, and the release notes. The notes come from version.md rather than from the
      # commit log, because what changed for someone using the application is not the same list as
      # what was merged. Doing it first means a bad tag fails within seconds, instead of after a
      # package has been built.
      - name: Take the version and the release notes from the tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          # Through the environment rather than inline, so that a tag name cannot become script.
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG

          # vMAJOR.MINOR.PATCH: three plain integers, as semantic versioning requires, and no
          # leading zeros. The zeros matter because the number below becomes AssemblyVersion,
          # where every part must be a plain integer and 01 is not one. A pre-release suffix such
          # as -beta1 is not accepted; adding one means widening this pattern deliberately.
          if ($tag -notmatch '^v(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}$') {
            Write-Error "Tag '$tag' is not of the form vMAJOR.MINOR.PATCH, with no leading zeros. For example: v0.1.0"
            exit 1
          }

          # Dropping the leading v leaves a value MSBuild accepts as Version directly.
          $version = $tag.Substring(1)
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_VERSION=$version"
          Write-Host "Version for this release: $version"

          $lines = @(Get-Content version.md)

          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i].Trim() -eq "## $tag") { $start = $i + 1; break }
          }
          if ($start -lt 0) {
            Write-Error "version.md has no '## $tag' section. Write the entry, commit it, and move the tag onto that commit."
            exit 1
          }

          $end = $lines.Count
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith('## ')) { $end = $i; break }
          }

          $notes = ''
          if ($end -gt $start) {
            $notes = ($lines[$start..($end - 1)] -join "`n").Trim()
          }
          if ([string]::IsNullOrWhiteSpace($notes)) {
            Write-Error "The '## $tag' section in version.md is empty."
            exit 1
          }

          Set-Content -Path release-notes.md -Value $notes -Encoding utf8NoBOM
          Write-Host "Release notes for ${tag}:"
          Write-Host $notes

      # The SDK is the build tooling, not a runtime the application needs. It builds both
      # targets: net8.0-windows and net48. .NET Framework 4.8 is part of Windows and cannot be
      # installed by this action, and the reference assemblies net48 compiles against come from
      # a NuGet package named in the project file, so nothing else has to be set up here.
      - name: Set up the .NET SDK (it builds both the net8 and net48 targets)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      # dotnet list package --vulnerable exits 0 whether or not it finds anything, so the output
      # has to be read. The check comes with the SDK: no service, no account, no package of its
      # own. It needs the restore above, and runs before the build so that a known-vulnerable
      # dependency stops the run early.
      - name: Check the dependencies for known vulnerabilities
        shell: pwsh
        run: |
          $report = dotnet list package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $report
          if ($LASTEXITCODE -ne 0) {
            Write-Error "dotnet list package exited with $LASTEXITCODE."
            exit 1
          }
          if ($report -match 'has the following vulnerable packages') {
            Write-Error "A dependency has a known vulnerability. The report above names it."
            exit 1
          }

      # RELEASE_VERSION is set by the step above, and only on a tag push. On a manual run it is
      # unset and the build keeps the <Version> in Directory.Build.props. The arguments are
      # assembled as an array so that an unset version adds no argument at all, rather than an
      # empty one.
      - name: Build (warnings treated as errors)
        shell: pwsh
        run: |
          $buildArgs = @('build', '-c', 'Release', '--no-restore', '-warnaserror')
          if ($env:RELEASE_VERSION) {
            $buildArgs += "-p:Version=$env:RELEASE_VERSION"
            $buildArgs += "-p:InformationalVersion=v$env:RELEASE_VERSION"
          }
          Write-Host "dotnet $buildArgs"
          dotnet @buildArgs

      - name: Run unit tests
        run: dotnet test -c Release --no-build --verbosity normal

      # Only the net48 build is published. .NET Framework 4.8 ships with Windows 10 version
      # 1903 and later and with Windows 11, so this one file runs on every supported Windows,
      # and on ARM as well because it is AnyCPU. The net8 target is still built and tested
      # above, as a second compiler over the same source.
      - name: Package the application (.NET Framework 4.8, no runtime install required)
        shell: pwsh
        run: |
          $publishArgs = @(
            'publish', 'src/WindowsSimpleTaskTabBar/WindowsSimpleTaskTabBar.csproj',
            '-c', 'Release', '-f', 'net48', '-o', 'artifacts'
          )
          if ($env:RELEASE_VERSION) {
            $publishArgs += "-p:Version=$env:RELEASE_VERSION"
            $publishArgs += "-p:InformationalVersion=v$env:RELEASE_VERSION"
          }
          Write-Host "dotnet $publishArgs"
          dotnet @publishArgs

      - name: Show the version the package carries
        shell: pwsh
        run: |
          $file = Get-Item artifacts/WindowsSimpleTaskTabBar.exe
          $file.VersionInfo | Format-List FileVersion, ProductVersion, FileDescription

      - name: Remove the debug symbols from the package
        shell: pwsh
        run: Remove-Item -Path artifacts/*.pdb -Force -ErrorAction SilentlyContinue

      # The installer and the ZIP carry their version in their file names, so that number has to
      # be the one the build actually used. On a tag push that is RELEASE_VERSION. On a manual
      # run nothing set it, and the build kept the <Version> in Directory.Build.props, so the
      # name is read from there rather than guessed: a file named after a version other than the
      # one inside it is worse than a file with no version in its name at all.
      - name: Work out the version the packages are named after
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          if (-not $version) {
            $props = Get-Content Directory.Build.props -Raw
            if ($props -notmatch '<Version>([^<]+)</Version>') {
              Write-Error "Directory.Build.props has no <Version> element for the package names to fall back on."
              exit 1
            }
            $version = $Matches[1].Trim()
          }
          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE_VERSION=$version"
          Write-Host "The packages are named after version $version"

      # Inno Setup is not on the runner image. Chocolatey is, so it installs it. There is no
      # NuGet package or SDK tool that builds an installer, which is why this one step reaches
      # outside the .NET toolchain.
      - name: Install Inno Setup (it builds the installer)
        run: choco install innosetup --no-progress --yes

      # ISCC writes the installer into artifacts\, beside the executable it packaged, because
      # OutputDir in the script points back there. The version goes in on the command line; the
      # script refuses to compile without it.
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC.exe is not at $iscc. The Inno Setup install above did not put it where this step expects it."
            exit 1
          }
          & $iscc "/DAppVersion=$env:PACKAGE_VERSION" installer\WindowsSimpleTaskTabBar.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup exited with $LASTEXITCODE."
            exit 1
          }

      # The portable package, for anyone who cannot or would rather not run an installer. It is
      # assembled in a folder of its own so the archive holds those four files at its top level
      # and nothing else - not the installer sitting next to them in artifacts\.
      - name: Build the portable ZIP
        shell: pwsh
        run: |
          $staging = 'package/portable'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item artifacts/WindowsSimpleTaskTabBar.exe -Destination $staging
          Copy-Item README.md, README.ja.md, LICENSE -Destination $staging
          # Braces around the variable: a period is a valid character in an environment variable
          # name, so $env:PACKAGE_VERSION.zip would be read as the name of a variable that does
          # not exist, and the archive would be called WindowsSimpleTaskTabBar-.
          $zip = "artifacts/WindowsSimpleTaskTabBar-${env:PACKAGE_VERSION}.zip"
          Compress-Archive -Path "$staging/*" -DestinationPath $zip -Force

      - name: Show what is being published
        shell: pwsh
        run: Get-ChildItem artifacts | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload the packages as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: WindowsSimpleTaskTabBar
          path: artifacts/

      # A manual run stops here. Only a v* tag creates the release. The three files are named one
      # by one rather than taken as artifacts/*, so a file that appeared in that folder for some
      # other reason cannot find its way into a release.
      - name: Attach the packages to a release (tag pushes only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64   # v3.0.3
        with:
          files: |
            artifacts/WindowsSimpleTaskTabBar-Setup-${{ env.PACKAGE_VERSION }}.exe
            artifacts/WindowsSimpleTaskTabBar-${{ env.PACKAGE_VERSION }}.zip
            artifacts/WindowsSimpleTaskTabBar.exe
          body_path: release-notes.md

  # A failure here leaves no record otherwise: GitHub emails whoever triggered the run and that is
  # all. Pushes only — a failing pull request already shows the failure on itself. The permission
  # is granted to this job alone, so the build above keeps its read-only token.
  report:
    needs: release
    if: always() && github.event_name == 'push'
    uses: ./.github/workflows/report-build-status.yml
    with:
      outcome: ${{ needs.release.result }}
    permissions:
      # contents: read so the call can read the reusable workflow file beside this one.
      contents: read
      issues: write
