# Verification only: does the source still build, and do the tests still pass?
#
# Packaging and publishing live in .github/workflows/release.yml. Keep the build and test
# steps below in step with that file; they are deliberately duplicated rather than shared,
# because two files are easier to read than a composite action.

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      # The SDK is the build tooling, not a runtime the application needs. It builds both
      # targets: net8.0-windows and net48. .NET Framework 4.8 is part of Windows and cannot be
      # installed by this action, and the reference assemblies net48 compiles against come from
      # a NuGet package named in the project file, so nothing else has to be set up here.
      - name: Set up the .NET SDK (it builds both the net8 and net48 targets)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (warnings treated as errors)
        run: dotnet build -c Release --no-restore -warnaserror

      - name: Run unit tests
        run: dotnet test -c Release --no-build --verbosity normal
